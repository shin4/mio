name: official-desktop-build

on:
  workflow_dispatch:
  pull_request:
    paths-ignore: ["**/*.md", "docs/**"]
  push:
    branches: [main]
    paths-ignore: ["**/*.md", "docs/**"]

concurrency:
  group: desktop-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macOS arm64, os: macos-14 }
          - { name: macOS x64, os: macos-15-intel }
          - { name: Windows x64, os: windows-latest }
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
          package_json_file: desktop/toolchain.json
      - name: Build official Desktop with Mio composition
        run: node script/desktop/run.mjs build
      - name: Replay MiMo responses through the built runtime
        working-directory: desktop
        run: node --test test/*.test.ts
      - uses: actions/upload-artifact@v4
        with:
          name: mio-build-evidence-${{ matrix.os }}
          path: .desktop-build/build-record.json
          include-hidden-files: true
          if-no-files-found: error
