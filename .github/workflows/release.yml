name: official-desktop-release

# Qualification only: publish these exact artifacts after all three jobs pass.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: official-desktop-release
  cancel-in-progress: false

jobs:
  package:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: mac-arm64, os: macos-14, apple: true }
          - { target: mac-x64, os: macos-15-intel, apple: true }
          - { target: win-x64, os: windows-latest, apple: false }
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
        with:
          version: 11.28.5
          package_json_file: desktop/toolchain.json
      - name: Prepare pinned official sources
        run: node script/desktop/prepare.mjs
      - name: Prepare platform signing configuration
        env:
          CSC_LINK: ${{ matrix.apple && secrets.CSC_LINK || '' }}
          CSC_KEY_PASSWORD: ${{ matrix.apple && secrets.CSC_KEY_PASSWORD || '' }}
          APPLE_ID: ${{ matrix.apple && secrets.APPLE_ID || '' }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ matrix.apple && secrets.APPLE_APP_SPECIFIC_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ matrix.apple && secrets.APPLE_TEAM_ID || '' }}
        run: node script/desktop/release-environment.mjs
      # actions/runner-images#14924: Intel HTTP/3 drops Apple ticket requests.
      # Keep notarization/stapling unchanged; TCP HTTPS remains available.
      - name: Route Intel Apple requests over TCP
        if: matrix.target == 'mac-x64'
        shell: bash
        run: |
          echo 'block return out quick proto udp from any to any port 443' | sudo pfctl -f -
          sudo pfctl -E
      - name: Build, package and qualify bundled runtime
        run: node script/desktop/run.mjs package ${{ matrix.target }} ${{ !matrix.apple && '--unsigned' || '' }}
      - name: Verify application identity, signatures and artifacts
        run: node script/desktop/verify-release.mjs ${{ matrix.target }}
      - name: Desktop regression tests
        working-directory: desktop
        run: node --test test/*.test.ts
      - name: Upstream upgrade compatibility and native CLI tests
        run: node script/desktop/test-upgrade.mjs
      - name: Upload qualified installers and evidence
        uses: actions/upload-artifact@v4
        with:
          name: mio-${{ matrix.target }}
          path: .desktop-build/release/${{ matrix.target }}
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
      - name: Diagnose actual Windows installation after packaged smoke failure
        if: failure() && !matrix.apple
        run: node script/desktop/verify-release.mjs win-x64
      - name: Collect redacted packaging failure journals
        if: failure()
        env:
          CSC_LINK: ${{ matrix.apple && secrets.CSC_LINK || '' }}
          CSC_KEY_PASSWORD: ${{ matrix.apple && secrets.CSC_KEY_PASSWORD || '' }}
          APPLE_ID: ${{ matrix.apple && secrets.APPLE_ID || '' }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ matrix.apple && secrets.APPLE_APP_SPECIFIC_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ matrix.apple && secrets.APPLE_TEAM_ID || '' }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node script/desktop/collect-packaging-diagnostics.mjs
      - name: Upload redacted packaging failure journals
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostics-${{ matrix.target }}-${{ github.run_attempt }}
          path: .desktop-build/diagnostics
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7
      - name: Remove signing inputs
        if: always()
        shell: bash
        run: |
          rm -f .desktop-build/upstream/apps/desktop/.env.macos .desktop-build/upstream/apps/desktop/.env.windows
          rm -rf .desktop-build/signing
