name: release

# Cut a release by pushing a `v*` tag, or from the Actions tab supplying the
# version. One job per platform+arch — the same structural constraint as
# build-check.yml: dsh's native dependencies ship as platform packages that the
# staging step installs for the host, so an artifact for another platform has to
# be built on that platform.
#
# The difference from build-check is credentials. macOS jobs sign with the
# Developer ID certificate and submit the result to Apple's notary service;
# without those secrets every job still succeeds and produces an unsigned
# artifact, which is what a fork or a credential-less run gets.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Release version without the leading v (e.g. 0.3.0)"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      - uses: actions/checkout@v6

      - id: version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            value="${{ inputs.version }}"
          else
            value="${GITHUB_REF_NAME}"
          fi
          value="${value#v}"
          echo "value=${value}" >> "$GITHUB_OUTPUT"
          echo "Release version: ${value}"

      # Created as a draft so a half-finished matrix never looks like a release.
      # The publish job below flips it once every artifact has landed.
      #
      # A semver prerelease (any version with a `-`, e.g. 0.3.0-rc.1) is marked
      # as one: GitHub does not infer this from the tag, and without the flag an
      # rc would take the "Latest" badge from the last stable release.
      - name: Ensure draft release exists
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          version="${{ steps.version.outputs.value }}"
          tag="v${version}"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $tag already exists"
            exit 0
          fi
          case "$version" in
            *-*) prerelease="--prerelease" ;;
            *) prerelease="" ;;
          esac
          gh release create "$tag" --repo "$GITHUB_REPOSITORY" --draft $prerelease \
            --title "$tag" --notes "Release $tag" --target "${{ github.sha }}"
          echo "Created draft $tag ${prerelease:-(stable)}"

  build:
    needs: prepare
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macOS arm64, os: macos-14, apple: true, glob: "packages/shell/dist/*.dmg" }
          # See build-check.yml: macos-13 was retired, and macos-15-intel is the
          # last x86_64 macOS image Actions will offer.
          - { name: macOS x64, os: macos-15-intel, apple: true, glob: "packages/shell/dist/*.dmg" }
          - { name: Windows x64, os: windows-latest, glob: "packages/shell/dist/*.exe" }
          - { name: Linux x64, os: ubuntu-latest, glob: "packages/shell/dist/*.AppImage" }
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      # The staging step installs the app tree with npm, so a Node toolchain is
      # required alongside Bun.
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # `--minimum-release-age=0`: bunfig.toml's gate guards *resolution*, and
      # this replays an already-reviewed lockfile. See build-check.yml.
      - name: Install workspace
        run: bun install --frozen-lockfile --minimum-release-age=0

      - name: Package
        working-directory: packages/shell
        env:
          # stage.ts stamps this into the app electron-builder packages;
          # packages/shell is private and is never version-bumped in git.
          MIO_VERSION: ${{ needs.prepare.outputs.version }}
          # macOS code signing. CSC_LINK is the base64 of the Developer ID
          # Application .p12. With it absent, auto-discovery is turned off and
          # electron-builder.config.ts sets `identity: null`, so the build
          # produces an unsigned app instead of failing.
          #
          # Gated on `matrix.apple` rather than passed everywhere: electron-builder
          # resolves the *Windows* signing certificate from WIN_CSC_LINK falling
          # back to CSC_LINK (`windowsSignToolManager.cscInfo`), so an unscoped
          # secret would hand a macOS Developer ID certificate to signtool's
          # certificate resolution on the Windows runner.
          CSC_LINK: ${{ matrix.apple && secrets.CSC_LINK || '' }}
          CSC_KEY_PASSWORD: ${{ matrix.apple && secrets.CSC_KEY_PASSWORD || '' }}
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ matrix.apple && secrets.CSC_LINK != '' }}
          # macOS notarization. All three are required, and APPLE_TEAM_ID is
          # additionally what flips `notarize` on in the config. Notarizing is a
          # round trip to Apple: expect these jobs to run minutes longer than
          # the build-check ones.
          APPLE_ID: ${{ matrix.apple && secrets.APPLE_ID || '' }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ matrix.apple && secrets.APPLE_APP_SPECIFIC_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ matrix.apple && secrets.APPLE_TEAM_ID || '' }}
          # Windows signing via Azure Trusted Signing. sign-windows.ps1 exits 0
          # when these are unset, producing an unsigned installer.
          AZURE_TRUSTED_SIGNING_ENDPOINT: ${{ secrets.AZURE_TRUSTED_SIGNING_ENDPOINT }}
          AZURE_TRUSTED_SIGNING_ACCOUNT_NAME: ${{ secrets.AZURE_TRUSTED_SIGNING_ACCOUNT_NAME }}
          AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE: ${{ secrets.AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE }}
        run: bun run package

      # Only the installers. electron-builder also writes .blockmap files, which
      # exist for electron-updater's differential downloads — they go up with
      # the updater feed once the app-side updater lands (MIGRATION.md, Phase 2).
      - name: Upload to the draft release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "v${{ needs.prepare.outputs.version }}" ${{ matrix.glob }} --clobber --repo "$GITHUB_REPOSITORY"

  publish:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    steps:
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "v${{ needs.prepare.outputs.version }}" --repo "$GITHUB_REPOSITORY" --draft=false
