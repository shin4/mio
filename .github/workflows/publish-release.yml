name: publish-qualified-desktop

on:
  workflow_dispatch:
    inputs:
      qualification_run:
        description: Successful official-desktop-release run ID
        required: true
        type: string

permissions:
  actions: read
  contents: write

concurrency:
  group: publish-qualified-desktop
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verify and publish qualified installers
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          QUALIFICATION_RUN: ${{ inputs.qualification_run }}
        run: node script/desktop/publish-release.mjs
