name: ci

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            | tar -xz -C /usr/local/bin gitleaks

      - name: Scan for secrets
        run: gitleaks detect --redact -c .gitleaks.toml

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - run: bun install --frozen-lockfile

      - name: Typecheck llm-mimo
        working-directory: packages/llm-mimo
        run: bun typecheck

      - name: Typecheck shell
        working-directory: packages/shell
        run: bun typecheck

      - name: Typecheck app
        working-directory: packages/app
        run: bun typecheck

      - name: Typecheck core
        working-directory: packages/core
        run: bun typecheck

      - name: Typecheck JavaScript SDK
        working-directory: packages/sdk/js
        run: bun typecheck

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - run: bun install --frozen-lockfile

      - name: Run unit tests
        run: bun turbo test:ci

      # The runtime tier targets Node, not Bun: its tests run under `node --test`
      # with type stripping (see packages/llm-mimo/package.json).
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Run llm-mimo replay tests
        working-directory: packages/llm-mimo
        run: bun run test:ci

      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: junit-results
          path: packages/**/.artifacts/unit/junit.xml
          if-no-files-found: ignore
