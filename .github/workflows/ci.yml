name: ci

on:
  # Run on demand: this work lands on pushed feature branches with no PR,
  # which neither trigger below covers.
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            | tar -xz -C /usr/local/bin gitleaks

      - name: Scan for secrets
        run: gitleaks detect --redact -c .gitleaks.toml

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      # `--minimum-release-age=0`: the gate in bunfig.toml guards *resolution*,
      # when a person adds or bumps a dependency. CI replays a lockfile that was
      # already reviewed, and would otherwise fail for days after every dsh bump.
      - run: bun install --frozen-lockfile --minimum-release-age=0

      - run: bun turbo typecheck

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      # `--minimum-release-age=0`: the gate in bunfig.toml guards *resolution*,
      # when a person adds or bumps a dependency. CI replays a lockfile that was
      # already reviewed, and would otherwise fail for days after every dsh bump.
      - run: bun install --frozen-lockfile --minimum-release-age=0

      - name: Lint
        run: bun run lint

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      # The runtime tier targets Node, not Bun: llm-mimo's replay tests run
      # under `node --test` with type stripping.
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # `--minimum-release-age=0`: the gate in bunfig.toml guards *resolution*,
      # when a person adds or bumps a dependency. CI replays a lockfile that was
      # already reviewed, and would otherwise fail for days after every dsh bump.
      - run: bun install --frozen-lockfile --minimum-release-age=0

      - name: Run tests
        run: bun turbo test:ci
